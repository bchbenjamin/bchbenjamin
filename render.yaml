# Render Blueprint: Java API + durable managed PostgreSQL.
# The paid plans are intentional: Free web services sleep and Free Postgres expires.
services:
  - type: web
    name: bchbenjamin-portfolio-api
    runtime: docker
    domains:
      - api.bchbenjamin.in
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bchbenjamin-portfolio-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://bchbenjamin.in
      - key: ALLOWED_ORIGINS
        value: https://bchbenjamin.in,https://www.bchbenjamin.in
      - key: SESSION_COOKIE_NAME
        value: __Host-PORTFOLIO_SESSION
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: CONTACT_IP_HASH_SALT
        generateValue: true
      - key: ADMIN_ALLOWED_SUBJECTS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_API_VERSION
        sync: false
      - key: CONTACT_AI_BASE_URL
        sync: false
      - key: CONTACT_AI_API_KEY
        sync: false
      - key: CONTACT_AI_MODEL
        sync: false
      - key: CONTACT_AI_PATH
        value: /v1/chat/completions
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: CONTACT_INBOX_EMAIL
        value: bchbenjamin@gmail.com
      - key: CONTACT_NOTIFICATION_CC
        value: ""
      - key: RATE_LIMIT_CONTACT_PER_MINUTE
        value: "4"
      - key: CONTACT_RETENTION_DAYS
        value: "180"
      - key: CONTACT_MAINTENANCE_ENABLED
        value: "true"

databases:
  - name: bchbenjamin-portfolio-db
    databaseName: portfolio
    user: portfolio
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []

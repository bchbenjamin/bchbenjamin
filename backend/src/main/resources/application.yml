spring:
  application:
    name: portfolio-api
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 13MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DATABASE_USERNAME:portfolio}
    password: ${DATABASE_PASSWORD:portfolio_dev_only}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  jackson:
    default-property-inclusion: non_null
  session:
    store-type: jdbc
    timeout: 8h
    jdbc:
      initialize-schema: never
      cleanup-cron: "-"
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 8000
          writetimeout: 8000
  security:
    oauth2:
      client:
        registration:
          google:
            provider: google
            client-id: ${GOOGLE_CLIENT_ID:disabled-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled-google-client-secret}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          linkedin:
            provider: linkedin
            client-id: ${LINKEDIN_CLIENT_ID:disabled-linkedin-client-id}
            client-secret: ${LINKEDIN_CLIENT_SECRET:disabled-linkedin-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
          linkedin-publisher:
            provider: linkedin
            client-id: ${LINKEDIN_CLIENT_ID:disabled-linkedin-client-id}
            client-secret: ${LINKEDIN_CLIENT_SECRET:disabled-linkedin-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email,w_member_social
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            user-name-attribute: sub
          linkedin:
            authorization-uri: https://www.linkedin.com/oauth/v2/authorization
            token-uri: https://www.linkedin.com/oauth/v2/accessToken
            user-info-uri: https://api.linkedin.com/v2/userinfo
            jwk-set-uri: https://www.linkedin.com/oauth/openid/jwks
            user-name-attribute: sub
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 1MB
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        name: ${SESSION_COOKIE_NAME:__Host-PORTFOLIO_SESSION}
        path: /
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
info:
  app:
    name: Portfolio API
    version: 0.1.0
app:
  linkedin:
    api-version: ${LINKEDIN_API_VERSION:}
  rate-limit:
    public-per-minute: ${RATE_LIMIT_PUBLIC_PER_MINUTE:120}
    agent-per-minute: ${RATE_LIMIT_AGENT_PER_MINUTE:60}
    admin-per-minute: ${RATE_LIMIT_ADMIN_PER_MINUTE:120}
    default-per-minute: ${RATE_LIMIT_DEFAULT_PER_MINUTE:60}
    contact-per-minute: ${RATE_LIMIT_CONTACT_PER_MINUTE:4}
  resume:
    ai-base-url: ${RESUME_AI_BASE_URL:}
    ai-api-key: ${RESUME_AI_API_KEY:}
    ai-model: ${RESUME_AI_MODEL:}
  contact:
    ai-base-url: ${CONTACT_AI_BASE_URL:}
    ai-api-key: ${CONTACT_AI_API_KEY:}
    ai-model: ${CONTACT_AI_MODEL:}
    ai-path: ${CONTACT_AI_PATH:/v1/chat/completions}
    smtp-from: ${CONTACT_FROM_EMAIL:${SMTP_USERNAME:}}
    inbox: ${CONTACT_INBOX_EMAIL:bchbenjamin@gmail.com}
    notification-cc: ${CONTACT_NOTIFICATION_CC:}
    ip-hash-salt: ${CONTACT_IP_HASH_SALT:}
    retention-days: ${CONTACT_RETENTION_DAYS:180}
    maintenance-enabled: ${CONTACT_MAINTENANCE_ENABLED:false}
    maintenance-delay-ms: ${CONTACT_MAINTENANCE_DELAY_MS:300000}
    cron-secret: ${CRON_SECRET:}
  frontend-url: ${FRONTEND_URL:https://www.bchbenjamin.in}
  security:
    admin-subjects: ${ADMIN_ALLOWED_SUBJECTS:}
    allowed-origins: ${ALLOWED_ORIGINS:https://www.bchbenjamin.in,https://bchbenjamin.in,http://localhost:3000}
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}

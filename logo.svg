<svg xmlns="http://www.w3.org/2000/svg" viewBox="270 240 1280 1660" width="1280" height="1660" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <path id="body" fill-rule="evenodd" d="M410.0,794.7 L745.0,551.2 L745.0,1559.7 L429.7,1265.7 L320.0,1368.0 L794.9,1810.9 L1318.0,1372.0 L950.0,1004.0 L1316.0,738.0 L858.0,280.0 L320.0,670.9 Z M900.0,914.0 L900.0,540.0 L1120.0,760.0 Z M1085.0,1375.0 L900.0,1530.0 L900.0,1190.0 Z"/>
    <clipPath id="cb"><use href="#body" clip-rule="evenodd"/></clipPath>
    <linearGradient id="glass" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.60"/>
      <stop offset="0.55" stop-color="#e9f6fb" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#d3eaf4" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="peach"><stop offset="0" stop-color="#ffa860" stop-opacity="0.60"/><stop offset="0.6" stop-color="#ffbf8a" stop-opacity="0.28"/><stop offset="1" stop-color="#ffbf8a" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue"><stop offset="0" stop-color="#3f95ff" stop-opacity="0.65"/><stop offset="0.6" stop-color="#6db3ff" stop-opacity="0.25"/><stop offset="1" stop-color="#6db3ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="teal"><stop offset="0" stop-color="#1fb5ae" stop-opacity="0.62"/><stop offset="0.6" stop-color="#4fd0c8" stop-opacity="0.26"/><stop offset="1" stop-color="#4fd0c8" stop-opacity="0"/></radialGradient>
    <linearGradient id="tealTube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0ffff" stop-opacity="0.95"/><stop offset="0.28" stop-color="#8fdde0" stop-opacity="0.6"/>
      <stop offset="0.75" stop-color="#3db4bd" stop-opacity="0.5"/><stop offset="1" stop-color="#bff2f4" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="greenTube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1ffef" stop-opacity="0.9"/><stop offset="0.3" stop-color="#94e79a" stop-opacity="0.6"/>
      <stop offset="0.75" stop-color="#3cb862" stop-opacity="0.52"/><stop offset="1" stop-color="#cdf8d2" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.5"/><stop offset="1" stop-color="#a9dcec" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="bead" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e9ffff"/><stop offset="0.45" stop-color="#6fd0d6" stop-opacity="0.9"/><stop offset="1" stop-color="#1f9aa6" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="b4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="b7"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dx="5" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- slab -->
  <g filter="url(#sh)">
    <use href="#body" fill="url(#glass)"/>
    <g clip-path="url(#cb)">
      <ellipse cx="572" cy="671" rx="190" ry="85" fill="url(#peach)" transform="rotate(-36 572 671) translate(-110 -50)"/>
      <ellipse cx="542" cy="1454" rx="200" ry="85" fill="url(#peach)" transform="rotate(43 542 1454) translate(-150 -10)"/>
      <circle cx="858" cy="280" r="210" fill="url(#blue)"/>
      <circle cx="795" cy="1811" r="230" fill="url(#blue)"/>
      <circle cx="1316" cy="738" r="190" fill="url(#teal)"/>
      <circle cx="1318" cy="1372" r="190" fill="url(#teal)"/>
      <use href="#body" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="12" filter="url(#b4)"/>
      <use href="#body" fill="none" stroke="#4f98b3" stroke-opacity="0.16" stroke-width="22" filter="url(#b7)"/>
    </g>
    <use href="#body" fill="none" stroke="#2c7d99" stroke-opacity="0.4" stroke-width="1.8" stroke-linejoin="round"/>
    <use href="#body" fill="none" stroke="url(#rim)" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <!-- D: semicircle ring on the stem -->
  <g filter="url(#sh)">
    <path d="M900.0,707.0 A290,290 0 0 1 900.0,1287.0 L900.0,1247.0 A250,250 0 0 0 900.0,747.0 Z" fill="#52cfc9" fill-opacity="0.45"/>
    <path d="M900.0,753.0 A244,244 0 0 1 900.0,1241.0 L900.0,1203.0 A206,206 0 0 0 900.0,791.0 Z" fill="#3fc66a" fill-opacity="0.45"/>
    <g fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="1.6"><path d="M900.0,707.0 A290,290 0 0 1 900.0,1287.0 L900.0,1247.0 A250,250 0 0 0 900.0,747.0 Z"/><path d="M900.0,753.0 A244,244 0 0 1 900.0,1241.0 L900.0,1203.0 A206,206 0 0 0 900.0,791.0 Z"/></g>
  </g>

  <!-- rod pairs -->
  <g transform="translate(525.0,974.6) rotate(-35)" filter="url(#sh)">
    <rect x="0" y="-34" width="1001.0" height="68" fill="#fff" fill-opacity="0.2" stroke="#fff" stroke-opacity="0.8" stroke-width="1.4"/>
    <rect x="0" y="-31" width="1001.0" height="26" fill="url(#tealTube)" stroke="#2c7d99" stroke-opacity="0.26"/>
    <rect x="0" y="3" width="1001.0" height="24" fill="url(#greenTube)" stroke="#2c7d99" stroke-opacity="0.26"/>
    <rect x="4" y="-28" width="1001.0" height="3" fill="#fff" fill-opacity="0.85" transform="scale(0.994 1)"/>
    <rect x="4" y="6" width="1001.0" height="3" fill="#fff" fill-opacity="0.8" transform="scale(0.994 1)"/>
  </g>
  <g transform="translate(560.0,1498.1) rotate(-35)" filter="url(#sh)">
    <rect x="0" y="-34" width="1110.9" height="68" fill="#fff" fill-opacity="0.2" stroke="#fff" stroke-opacity="0.8" stroke-width="1.4"/>
    <rect x="0" y="-31" width="1110.9" height="26" fill="url(#tealTube)" stroke="#2c7d99" stroke-opacity="0.26"/>
    <rect x="0" y="3" width="1110.9" height="24" fill="url(#greenTube)" stroke="#2c7d99" stroke-opacity="0.26"/>
    <rect x="4" y="-28" width="1110.9" height="3" fill="#fff" fill-opacity="0.85" transform="scale(0.994 1)"/>
    <rect x="4" y="6" width="1110.9" height="3" fill="#fff" fill-opacity="0.8" transform="scale(0.994 1)"/>
  </g>

  <!-- the two dots -->
  <g filter="url(#sh)">
    <circle cx="685" cy="794" r="26" fill="url(#bead)" stroke="#fff" stroke-opacity="0.9" stroke-width="3"/>
    <circle cx="677" cy="784" r="8" fill="#fff" fill-opacity="0.85"/>
    <circle cx="940" cy="625" r="17" fill="url(#bead)" stroke="#fff" stroke-opacity="0.9" stroke-width="2.5"/>
    <circle cx="935" cy="618" r="5" fill="#fff" fill-opacity="0.85"/>
  </g>
